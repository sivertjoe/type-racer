[package]
name = "type-racer-core"
version = "0.2.1"
edition = "2024"
authors = ["Sivert Johansen <sivert-joh@hotmail.com>"]
description = "Core game engine (protocol, networking, gamemodes) for type-racer"

[dependencies]
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }
color-eyre = "0.6.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rand = "0.10.2"
